name: Build and Push Docker Image

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Get version from pom.xml
        id: get_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Check if Docker tag already exists
        run: |
            echo "Checking if tag $VERSION exists..."
            response=$(curl -s -o /dev/null -w "%{http_code}" https://hub.docker.com/v2/repositories/fischernz/helpme-auth-ms/tags/${VERSION})
            if [ "$response" -eq 200 ]; then
              echo "Docker image with tag $VERSION already exists. Aborting."
              exit 1
            else
              echo "Tag $VERSION does not exist. Proceeding..."
            fi

      - name: Build project
        run: mvn clean install

      - name: Login docker
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}

      - name: Build and push Docker image
        run: |
          docker buildx create --use
          docker buildx build --push --tag fischernz/helpme-auth-ms:${{ env.VERSION }} .